<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XVynora IPTV</title>
<link rel="stylesheet" href="/web/iptvorg.css">
</head>
<body>
<div class="app">
<header>
<div>
<div class="eyebrow">XVYNORA</div>
<h1>Live TV</h1>
<p>IPTV-org channels</p>
</div>
<div class="search">
<input id="search" placeholder="Search channels...">
</div>
</header>

<nav id="categories">
<button class="active" data-filter="all">All</button>
<button data-filter="uk">🇬🇧 UK</button>
<button data-filter="pk">🇵🇰 Pakistan</button>
<button data-filter="sports">⚽ Sports</button>
<button data-filter="sky">Sky Sports</button>
</nav>

<section>
<h2>Sources</h2>
<div id="sources" class="source-grid"></div>
</section>

<section>
<h2>Channels</h2>
<div id="channels" class="channels"></div>
</section>
</div>

<script src="/web/iptvorg.js"></script>
</body>
</html>
