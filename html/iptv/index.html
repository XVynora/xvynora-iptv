    function parseXMLTV(
        text
    ) {

        const parser =
            new DOMParser();

        const xml =
            parser.parseFromString(
                text,
                "application/xml"
            );

        const programmes =
            xml.querySelectorAll(
                "programme"
            );

        state.epg.clear();
        state.epgAliases.clear();

        xml.querySelectorAll("channel").forEach(channel => {
            const id = channel.getAttribute("id");
            const name = channel.querySelector("display-name")?.textContent?.trim();
            if(id && name)
                state.epgAliases.set(name.toLowerCase(), id);
        });

        programmes.forEach(
            program => {

                const channel =
                    program.getAttribute(
                        "channel"
                    );

                if(!channel)
                    return;

                if(
                    !state.epg.has(channel)
                )
                    state.epg.set(
                        channel,
                        []
                    );

                state.epg
                    .get(channel)
                    .push({

                        start:
                            parseXMLDate(
                                program.getAttribute(
                                    "start"
                                )
                            ),

                        stop:
                            parseXMLDate(
                                program.getAttribute(
                                    "stop"
                                )
                            ),

                        title:
                            program
                                .querySelector(
                                    "title"
                                )
                                ?.textContent
                                .trim() ||
                            "Untitled"

                    });

            }
        );

    }

    function parseXMLDate(
        value
    ) {

        if(!value)
            return 0;

        const match =
            value.match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
            );

        if(!match)
            return Date.parse(
                value
            );

        return Date.UTC(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3]),
            Number(match[4]),
            Number(match[5]),
            Number(match[6])
        );

    }

    /* ========================================================
       GUIDE
       ======================================================== */

    function updateGuide() {

        const grid =
            $("guideGrid");

        if(!grid)
            return;

        const now =
            Date.now() +
            state.guideOffset * 3600000;

        const channels =
            state.filtered
                .slice(0,40);

        let html = "";

        html += `
            <div class="guide-head">
                Channel
            </div>
        `;

        for(
            let i = 0;
            i < 6;
            i++
        ) {

            html += `
                <div class="guide-head">
                    ${new Date(
                        now +
                        i * 3600000
                    ).toLocaleTimeString(
                        [],
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    )}
                </div>
            `;

        }

        for(
            const channel of channels
        ) {

            html += `

                <div class="guide-channel">

                    ${
                        channel.logo
                        ? `
                            <img
                                src="${escapeHTML(channel.logo)}"
                                style="
                                    width:36px;
                                    height:36px;
                                    object-fit:contain;
                                ">
                        `
                        : ""
                    }

                    <span>
                        ${escapeHTML(
                            channel.title
                        )}
                    </span>

                </div>
            `;

            const programs =
                channel.now || channel.next
                    ? []
                    : programsForChannel(channel);

            if(
                !programs.length &&
                channel.now
            ) {

                programs.push(
                    {
                        ...channel.now,
                        start:
                            Date.parse(
                                channel.now.start
                            ),
                        stop:
                            Date.parse(
                                channel.now.stop
                            )
                    }
                );

            }

            if(
                !programs.length &&
                channel.next
            ) {

                programs.push(
                    {
                        ...channel.next,
                        start:
                            Date.parse(
                                channel.next.start
                            ),
                        stop:
                            Date.parse(
                                channel.next.stop
                            )
                    }
                );

            }

            for(
                let slot = 0;
                slot < 6;
                slot++
            ) {

                const slotStart =
                    now +
                    slot * 3600000;

                const program =
                    programs.find(
                        p =>
                            p.start <=
                            slotStart &&
                            p.stop >
                            slotStart
                    );

                html += `

                    <div
                        class="guide-program ${
                            program
                            ? "now"
                            : ""
                        }"
                        tabindex="0"
                        data-stream="${
                            escapeHTML(
                                channel.id
                            )
                        }">

                        <div class="program-title">
                            ${
                                program
                                ? escapeHTML(
                                    program.title
                                )
                                : "No EPG data"
                            }
                        </div>

                        <div class="program-time">
                            ${
                                program
                                ? `${new Date(program.start).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})} – ${new Date(program.stop).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})}`
                                : "No EPG data"
                            }
                        </div>

                        ${
                            program &&
                            program.start <= now &&
                            program.stop > now
                                ? `<div class="program-progress" style="width:${Math.max(0, Math.min(100, (now - program.start) / (program.stop - program.start) * 100))}%"></div>`
                                : ""
                        }

                    </div>
                `;

            }

        }

        grid.innerHTML =
            html;

    }

    function programsForChannel(channel) {

        const keys = [
            channel.id,
            channel.tvgId,
            channel.epgId,
            state.epgAliases.get(
                String(channel.title || "").toLowerCase()
            )
        ].filter(Boolean);

        for(const key of keys) {
            const programs = state.epg.get(key);
            if(programs?.length)
                return programs;
        }

        return [];

    }

    /* ========================================================
       HEALTH PROBING
       ======================================================== */

    async function probeChannel(
        channel,
        signal
    ) {

        if(signal?.aborted)
            return;

        channel.status = "probing";
        updateCardStatus(channel);

        const streams =
            [channel.stream, ...(channel.stream_urls || [])]
            .map(normalizeUrl)
            .filter(
                (url,index,values) =>
                    url && values.indexOf(url) === index
            );

        const ordered =
            rankStreams(channel, streams);

        for(const url of ordered) {

            if(signal?.aborted)
                return;

            const cached =
                readHealthCache(url);

            if(cached && cached.status === "online") {
                channel.status = "online";
                channel.stream = url;
                updateCardStatus(channel);
                scheduleScanRefresh();
                return;
            }

            try {
                await validatePlayback(url, signal);
                channel.status = "online";
                channel.stream = url;
                writeHealthCache(url, "online");
                updateCardStatus(channel);
                scheduleScanRefresh();
                return;
            } catch(error) {
                if(signal?.aborted)
                    return;
                writeHealthCache(url, "failed");
                console.debug("Stream validation failed", error);
            }
        }

        if(signal?.aborted)
            return;

        channel.status = streams.length ? "failed" : "unknown";
        updateCardStatus(channel);
        scheduleScanRefresh();

    }

    function rankStreams(channel, streams) {

        return streams
            .map(
                (url,index) => {
                    const cached = readHealthCache(url);
                    const retry = state.scanState.retries.get(url) || 0;
                    return {
                        url,
                        score:
                            (cached?.status === "online" ? 10000 : 0) +
                            (cached?.status === "failed" ? -retry * 100 : 0) -
                            retry * 10 - index
                    };
                }
            )
            .sort((a,b) => b.score - a.score)
            .map(item => item.url);

    }

    function validatePlayback(url, signal) {

        return new Promise((resolve,reject) => {

            const video = document.createElement("video");
            const hls =
                window.Hls && Hls.isSupported()
                    ? new Hls({enableWorker:true, lowLatencyMode:true})
                    : null;
            let timer = null;
            let settled = false;

            const cleanup = () => {
                clearTimeout(timer);
                video.pause();
                video.removeAttribute("src");
                video.load();
                if(hls) {
                    try {
                        hls.detachMedia();
                        hls.destroy();
                    } catch {}
                }
                video.removeEventListener("playing", onPlaying);
                video.removeEventListener("error", onError);
                signal?.removeEventListener("abort", onAbort);
            };

            const finish = error => {
                if(settled)
                    return;
                settled = true;
                cleanup();
                error ? reject(error) : resolve();
            };

            const onPlaying = () => finish();
            const onError = () => finish(new Error("media playback failed"));
            const onAbort = () =>
                finish(new DOMException("validation cancelled", "AbortError"));

            video.muted = true;
            video.playsInline = true;
            video.preload = "metadata";
            video.addEventListener("playing", onPlaying);
            video.addEventListener("error", onError);
            signal?.addEventListener("abort", onAbort, {once:true});
            timer = setTimeout(
                () => finish(new Error("playback validation timed out")),
                6500
            );

            if(video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = url;
                video.play().catch(onError);
            } else if(hls) {
                hls.attachMedia(video);
                hls.loadSource(url);
                hls.on(Hls.Events.MANIFEST_PARSED, () =>
                    video.play().catch(onError)
                );
                hls.on(Hls.Events.ERROR, (event,data) => {
                    if(data.fatal)
                        onError();
                });
            } else {
                finish(new Error("HLS playback is unsupported"));
            }
        });
    }

    function healthCache() {

        if(state.scanState.healthCache)
            return state.scanState.healthCache;

        try {
            state.scanState.healthCache = JSON.parse(
                localStorage.getItem("xvynora-health-cache") || "{}"
            );
        } catch {
            state.scanState.healthCache = {};
        }

        return state.scanState.healthCache;
    }

    function readHealthCache(url) {
        const entry = healthCache()[url];
        if(!entry || Date.now() - entry.checked > 15 * 60 * 1000)
            return null;
        return entry;
    }

    function writeHealthCache(url, status) {
        const cache = healthCache();
        cache[url] = {status, checked:Date.now()};
        const keys = Object.keys(cache);
        if(keys.length > 2000)
            delete cache[keys[0]];
        try {
            localStorage.setItem(
                "xvynora-health-cache",
                JSON.stringify(cache)
            );
        } catch {}
    }

    function scheduleScanRefresh() {
        if(state.scanState.refreshTimer)
            return;
        state.scanState.refreshTimer =
            setTimeout(() => {
                state.scanState.refreshTimer = null;
                applyFilters();
            }, 150);
    }

    function updateCardStatus(
        channel
    ) {

        document
            .querySelectorAll(
                `[data-id="${CSS.escape(
                    channel.id
                )}"] .status-dot`
            )
            .forEach(
                dot => {

                    dot.className =
                        "status-dot " +
                        (
                            channel.status ===
                            "online"
                                ? "online"
                                : channel.status ===
                                  "failed"
                                    ? "offline"
                                    : "probing"
                        );

                }
            );

    }

    async function probeBatch(
        channels,
        concurrency = 10
    ) {

        if(!channels.length) {
            state.scanState.running = false;
            updateScanStatus("Working only");
            return;
        }

        state.scanState.total =
            channels.length;
        state.scanState.scanned = 0;
        state.scanState.running = true;

        const controller =
            new AbortController();

        state.scanState.abort =
            controller;

        let index = 0;

        async function worker() {

            while(
                index < channels.length
            ) {

                if(controller.signal.aborted)
                    break;

                const current =
                    channels[
                        index++
                    ];

                    state.scanState.active += 1;
                    updateScanStatus("Testing streams");
                    try {
                        await probeWithRetry(
                            current,
                            controller.signal
                        );
                    } catch(error) {
                        if(!controller.signal.aborted)
                            console.debug(
                                "Channel scan failed",
                                error
                            );
                    } finally {
                        state.scanState.active =
                            Math.max(
                                0,
                                state.scanState.active - 1
                            );
                        updateScanStatus("Testing streams");
                    }

            }

        }

        await Promise.all(
            Array.from(
                {
                    length:
                        Math.min(
                            concurrency,
                            channels.length
                        )
                },
                worker
            )
        );

        state.scanState.running = false;
        state.scanState.abort = null;
        updateScanStatus("Working only");

        if(
            state.workingOnly &&
            !state.filtered.length
        ) {
            $("heroTitle").textContent =
                "No working channels found";
            $("heroDescription").textContent =
                "No channel has validated as playable yet. Continue scanning or import more sources.";
        }

    }

    function prioritizeScanChannels(channels) {

        const visible =
            new Set(
                [...document.querySelectorAll(".card")]
                    .map(card => card.dataset.id)
            );
        const currentCategory =
            state.current?.category || state.filter;

        return channels
            .slice(0, 5000)
            .map((channel,index) => ({
                channel,
                score:
                    (visible.has(channel.id) ? 10000 : 0) +
                    (state.favorites.has(channel.id) ? 5000 : 0) +
                    (channel === state.current ? 3000 : 0) +
                    (currentCategory !== "all" &&
                        channel.category === currentCategory ? 1000 : 0) -
                    index
            }))
            .sort((a,b) => b.score - a.score)
            .map(item => item.channel);

    }

    async function probeWithRetry(channel, signal) {

        const key =
            channel.stream || channel.id;
        const retry =
            state.scanState.retries.get(key) || 0;

        await probeChannel(channel, signal);

        if(
            channel.status === "failed" &&
            retry < 1 &&
            !signal.aborted
        ) {
            state.scanState.retries.set(key, retry + 1);
            await waitForRetry(
                250 * (2 ** retry),
                signal
            );
            if(!signal.aborted)
                await probeChannel(channel, signal);
        }

        if(!signal.aborted) {
            state.scanState.scanned += 1;
            updateScanStatus("Testing streams");
        }

    }

    function waitForRetry(delay, signal) {

        return new Promise((resolve,reject) => {
            const timer = setTimeout(resolve, delay);
            const cancel = () => {
                clearTimeout(timer);
                reject(new DOMException("scan cancelled", "AbortError"));
            };
            if(signal.aborted) {
                cancel();
                return;
            }
            signal.addEventListener("abort", cancel, {once:true});
        });

    }

    /* ========================================================
       HLS / PLAYER
       ======================================================== */

    async function openPlayer(
        channel
    ) {

        if(!channel)
            return;

        state.lastFocusBeforePlayer =
            document.activeElement;
        state.lastPlaybackChannel =
            channel;
        state.current =
            channel;

        $("player").classList.add(
            "open"
        );

        $("playerTitle")
            .textContent =
            channel.title;

        $("playerProgram")
            .textContent =
            channel.now?.title ||
            channel.group ||
            "Live TV";

        const volume =
            Number(
                localStorage.getItem(
                    "xvynora-volume"
                ) || state.volume || 0.8
            );

        state.volume =
            volume;
        $("volume").value =
            String(volume);
        $("video").volume =
            volume;
        $("video").muted =
            false;
        updateMuteIcon();

        populateChannelDrawer();
        showPlayerHud();

        playStream(channel).catch(
            error =>
                console.error(
                    "IPTV playback error",
                    error
                )
        );

    }

    async function playStream(
        channel
    ) {

        const session =
            ++state.playbackSession;

        if(state.playbackAbort)
            state.playbackAbort.abort();

        state.playbackAbort =
            new AbortController();
        state.attemptedStreams =
            new Set();

        destroyHLS();

        const video =
            $("video");

        $("quality").disabled = true;
        $("quality").innerHTML =
            '<option value="-1">Auto</option>';

        video.pause();
        video.removeAttribute("src");
        video.load();

        const urls =
            [
                channel.stream,
                ...(channel.stream_urls || [])
            ]
            .map(normalizeUrl)
            .filter(
                (url,index,values) =>
                    url && values.indexOf(url) === index
            );

        if(!urls.length) {

            toast(
                "This channel has no stream URL"
            );

            return;

        }

        for(const url of urls) {

            if(
                session !== state.playbackSession ||
                state.playbackAbort.signal.aborted
            )
                return;

            if(state.attemptedStreams.has(url))
                continue;

            state.attemptedStreams.add(url);
            channel.status = "probing";
            updateCardStatus(channel);
            $("playerProgram").textContent =
                `Trying ${channel.title}… ${state.attemptedStreams.size}/${urls.length}`;

            try {

                await playStreamCandidate(
                    channel,
                    url,
                    session,
                    state.playbackAbort.signal
                );

                if(session !== state.playbackSession)
                    return;

                channel.status = "online";
                updateCardStatus(channel);
                return;

            } catch(error) {

                if(
                    session !== state.playbackSession ||
                    state.playbackAbort.signal.aborted
                )
                    return;

                console.warn(
                    "IPTV stream failed",
                    error
                );
                destroyHLS();
                video.pause();
                video.removeAttribute("src");
                video.load();
                $("playerProgram").textContent =
                    "Switching to backup stream…";

            }

        }

        if(session !== state.playbackSession)
            return;

        channel.status = "failed";
        updateCardStatus(channel);
        toast("Stream unavailable");
        $("playerProgram").textContent =
            `${channel.title} unavailable`;

    }

    function playStreamCandidate(
        channel,
        url,
        session,
        signal
    ) {

        return new Promise(
            (resolve,reject) => {

                const video = $("video");
                let settled = false;
                let timer = null;

                const clean = () => {
                    clearTimeout(timer);
                    video.removeEventListener("playing", onPlaying);
                    video.removeEventListener("error", onError);
                    signal.removeEventListener("abort", onAbort);
                };

                const finish = (error) => {
                    if(settled)
                        return;
                    settled = true;
                    clean();
                    if(error)
                        reject(error);
                    else
                        resolve();
                };

                const onPlaying = () => {
                    if(session === state.playbackSession)
                        finish();
                };

                const onError = () =>
                    finish(new Error("media playback failed"));

                const onAbort = () =>
                    finish(new DOMException("Playback cancelled", "AbortError"));

                if(signal.aborted) {
                    onAbort();
                    return;
                }

                video.addEventListener("playing", onPlaying);
                video.addEventListener("error", onError);
                signal.addEventListener("abort", onAbort, {once:true});
                timer = setTimeout(
                    () =>
                        finish(new Error("playback timed out")),
                    7000
                );

                const start = () => {
                    if(session !== state.playbackSession) {
                        onAbort();
                        return;
                    }
                    video.play().catch(onError);
                };

            if(
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ) {

                    video.src = url;
                    video.load();
                    start();

            }

            else if(
                window.Hls &&
                Hls.isSupported()
            ) {

                state.hls =
                    new Hls({

                        enableWorker: true,

                        lowLatencyMode:
                            true,

                        backBufferLength:
                            30,

                        maxBufferLength:
                            20,

                        capLevelToPlayerSize:
                            true

                    });

                state.hls.loadSource(
                    url
                );

                state.hls.attachMedia(
                    video
                );

                state.hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    () => {

                        if(session !== state.playbackSession) {
                            finish(new Error("stale playback session"));
                            return;
                        }

                        populateQuality();
                        start();

                    }
                );

                state.hls.on(
                    Hls.Events.ERROR,
                    (
                        event,
                        data
                    ) => {

                        if(session !== state.playbackSession)
                            return;

                        if(
                            data.fatal
                        ) {

                            if(
                                data.type ===
                                Hls.ErrorTypes.NETWORK_ERROR
                            ) {

                                finish(new Error("network stream failure"));

                            }

                            else if(
                                data.type ===
                                Hls.ErrorTypes.MEDIA_ERROR
                            ) {

                                finish(new Error("media stream failure"));

                            }

                            else {

                                finish(new Error("HLS stream failure"));

                            }

                        }

                    }
                );

            }

            else {

                video.src = url;
                video.load();
                start();

            }

            }
        );

    }

    function destroyHLS() {

        if(state.hls) {

            try {
                state.hls.detachMedia();
                state.hls.destroy();
            } catch {}

    }

                        channel.tvgId ===
                        failed.tvgId

            );

        if(
            alternatives.length

            toast(
                "Stream failed — trying another source"
            );

            openPlayer(
                alternatives[0]
            );

        } else {

            toast(
                "Stream unavailable"
            );

        }

    }

    function startRecording() {

        const video =
            $("video");

        if(
            !window.MediaRecorder
        ) {

            toast(
                "MediaRecorder is not supported by this browser"
            );

            return;

        }

        if(
            !video.captureStream
        ) {

            toast(
                "This browser cannot capture the video element"
            );

            return;

        }

        try {

            const stream =
                video.captureStream();

            let mime =
                "";

            const options = [
                "video/webm;codecs=vp9,opus",
                "video/webm;codecs=vp8,opus",
                "video/webm"
            ];

            for(
                const candidate
                of options
            ) {

                if(
                    MediaRecorder.isTypeSupported(
                        candidate
                    )
                ) {

                    mime =
                        candidate;

                    break;

                }

            }

            state.recordedChunks =
                [];

            state.recorder =
                new MediaRecorder(
                    stream,
                    mime
                        ? {mimeType:mime}
                        : undefined
                );

            state.recorder.ondataavailable =
                event => {

                    if(
                        event.data.size
                    )
                        state.recordedChunks
                            .push(
                                event.data
                            );

                };

            state.recorder.onstop =
                saveRecording;

            state.recorder.start(
                1000
            );

            state.recordStarted =
                Date.now();

            $("recording")
                .classList.add(
                    "active"
                );

            state.recordTimer =
                setInterval(
                    updateRecordTimer,
                    1000
                );

            toast(
                "Recording started"
            );

        } catch(error) {

            console.error(error);

            toast(
                "Recording could not start"
            );

        }

    }

    function stopRecording() {

        if(
            !state.recorder
        )
            return;

        state.recorder.stop();

        clearInterval(
            state.recordTimer
        );

        $("recording")
            .classList.remove(
                "active"
            );

        state.recorder =
            null;

    }

    function updateRecordTimer() {

        const elapsed =
            Math.floor(
                (
                    Date.now() -
                    state.recordStarted
                ) / 1000
            );

        const minutes =
            Math.floor(
                elapsed / 60
            )
            .toString()
            .padStart(2,"0");

        const seconds =
            (
                elapsed % 60
            )
            .toString()
            .padStart(2,"0");

        $("recordTimer")
            .textContent =
            `${minutes}:${seconds}`;

    }

    function saveRecording() {

        if(
            !state.recordedChunks.length
        )
            return;

        const blob =
            new Blob(
                state.recordedChunks,
                {
                    type:
                        state.recordedChunks[0]
                            .type ||
                        "video/webm"
                }
            );

        const url =
            URL.createObjectURL(
                blob
            );

        const link =
            document.createElement(
                "a"
            );

        link.href =
            url;

        link.download =
            `${(
                state.current?.title ||
                "xvynora-recording"
            ).replace(
                /[^a-z0-9-_]+/gi,
                "-"
            )}-${Date.now()}.webm`;

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();

        setTimeout(
            () =>
                URL.revokeObjectURL(
                    url
                ),
            5000
        );

        toast(
            "Recording saved"
        );

    }

    /* ========================================================
       OVERLAYS
       ======================================================== */

    function openOverlay(
        id
    ) {

        state.overlayFocus.set(
            id,
            document.activeElement
        );

        $(id).classList.add(
            "open"
        );

        requestAnimationFrame(
            () =>
                focusablesIn(
                    $(id)
                )[0]?.focus()
        );

    }

    function closeOverlay(
        id
    ) {

        $(id).classList.remove(
            "open"
        );

        const focus =
            state.overlayFocus.get(id);

        if(
            focus &&
            typeof focus.focus === "function"
        )
            requestAnimationFrame(
                () => focus.focus()
            );

        state.overlayFocus.delete(id);

    }

    function closeAllOverlays() {

        [
            "searchOverlay",
            "guideOverlay",
            "settingsOverlay"
        ]
        .forEach(
            id =>
                closeOverlay(id)
        );

    }

    function toggleDrawer(
        id,
        focusId
    ) {

        const drawer = $(id);
        const open = drawer.classList.toggle("open");

        if(open) {
            requestAnimationFrame(
                () => focusablesIn(drawer)[0]?.focus()
            );
        } else {
            requestAnimationFrame(
                () => $(focusId)?.focus()
            );
        }

    }

    function smoothScrollBy(
        container,
        left,
        top
    ) {

        if(!container)
            return;

        let motion =
            state.scrollMotion.get(container);

        if(!motion) {
            motion = {
                left: 0,
                top: 0,
                frame: 0
            };
            state.scrollMotion.set(
                container,
                motion
            );
        }

        motion.left += left;
        motion.top += top;

        if(motion.frame)
            return;

        const tick = () => {
            motion.left *= .72;
            motion.top *= .72;

            container.scrollLeft += motion.left;
            container.scrollTop += motion.top;

            if(
                Math.abs(motion.left) > .25 ||
                Math.abs(motion.top) > .25
            ) {
                motion.frame = requestAnimationFrame(tick);
            } else {
                motion.left = 0;
                motion.top = 0;
                motion.frame = 0;
            }
        };

        motion.frame =
            requestAnimationFrame(tick);

    }

                        updateCardStatus(state.current);

                    $("playerProgram").textContent = "Buffering…";
                }
            );

        $("video")
            .addEventListener(
                "stalled",
                () => {
                    if(state.current) {
                        state.current.status = "buffering";
                        updateCardStatus(state.current);
                    }
                    $("playerProgram").textContent = "Buffering…";
                }
            );

        $("video")
            .addEventListener(
                "playing",
                () => {
                    if(state.current)
                        state.current.status = "online";
                    if(state.current)
                        updateCardStatus(state.current);
                    if(state.current)
                        $("playerProgram").textContent =
                            state.current.now?.title ||
                            state.current.group ||
                            "Live TV";
                }
            );

        window.addEventListener(
            "offline",
            () => {
                if(state.current)
                    state.current.status = "buffering";
                if(state.current)
                    updateCardStatus(state.current);
                if($("player").classList.contains("open"))
                    $("playerProgram").textContent =
                        "Network connection lost";
                toast("Network connection lost");
            }
        );

        window.addEventListener(
            "online",
            () => {
                if($("player").classList.contains("open"))
                    $("playerProgram").textContent = "Network restored";
            }
        );

        document
            .querySelectorAll(
                ".nav-button"
            )
            .forEach(
                button => {

                    button.onclick =
                        () => {

                            document
                                .querySelectorAll(
                                    ".nav-button"
                                )
                                .forEach(
                                    x =>
                                        x.classList.remove(
                                            "active"
                                        )
                                );

                            button.classList.add(
                                "active"
                            );

                            const view =
                                button.dataset.view;

                            if(
                                view ===
                                "guide"
                            )
                                openOverlay(
                                    "guideOverlay"
                                );

                            else if(
                                view ===
                                "favorites"
                            ) {

                                state.filter =
                                    "all";

                                $("favoritesShelf")
                                    .hidden =
                                    false;

                            }

                            else if(
                                view ===
                                "sports"
                            ) {

                                state.filter =
                                    "Sports";

                                applyFilters();

                            }

                            else {

                                state.filter =
                                    "all";

                                applyFilters();

                            }

                        };

                }
            );

        document.addEventListener(
            "keydown",
            handleKeyboard
        );

        $("video").addEventListener(
            "click",
            () => {

                if(
                    $("player")
                        .classList
                        .contains("open")
                ) {
                    const hud =
                        $("playerHud");

                    if(hud.classList.contains("hidden"))
                        showPlayerHud();
                    else
                        hidePlayerHud();
                }

            }
        );

        $("video").addEventListener(
            "dblclick",
            async () => {

                if(
                    document.fullscreenElement
                ) {
                    await document.exitFullscreen().catch(() => {});
                } else {
                    await $("player").requestFullscreen().catch(() => {});
                }

            }
        );

        $("player").addEventListener(
            "mousemove",
            () => {
                if($("player").classList.contains("open"))
                    showPlayerHud();
            },
            {passive:true}
        );

        document.addEventListener(
            "click",
            event => {

                if(
                    event.target.closest(
                        ".overlay"
                    ) &&
                    !event.target.closest(
                        ".glass-panel, .search-panel, .panel-close, .nav-button, .filter-chip, button, input, select"
                    )
                ) {
                    closeAllOverlays();
                }

                const program =
                    event.target.closest(
                        ".guide-program"
                    );

                if(program) {

                    const id =
                        program.dataset.stream;

                    const channel =
                        state.channels.find(
                            x =>
                                x.id === id
                        );

                    if(channel)
                        openPlayer(
                            channel
                        );

                }

            }
        );

        document.addEventListener(
            "wheel",
            event => {
                const target = event.target;
                const drawer = target.closest("#channelList");
                const guide = target.closest(".guide-container");
                const results = target.closest(".search-results");
                const shelf = target.closest(".shelf-viewport");
                const scale = event.deltaMode === 1 ? 16 : 1;
                const deltaX = event.deltaX * scale;
                const deltaY = event.deltaY * scale;

                if(drawer || guide || results) {
                    event.preventDefault();
                    const container = drawer || guide || results;
                    smoothScrollBy(container, deltaX, deltaY);
                    return;
                }

                if(shelf) {
                    event.preventDefault();
                    smoothScrollBy(
                        shelf,
                        deltaX || deltaY,
                        0
                    );
                }
            },
            { passive: false }
        );

        $("video")
            .addEventListener(
                "play",
                updatePlayIcon
            );

        $("video")
            .addEventListener(
                "pause",
                updatePlayIcon
            );

        $("video")
            .addEventListener(
                "timeupdate",
                updateProgress
            );

        $("video")
            .addEventListener(
                "loadedmetadata",
                updateStreamInfo
            );

        $("video")
            .addEventListener(
                "error",
                () => {

                    updatePlayIcon();

                }
            );

    }

    /* ========================================================
       KEYBOARD
       ======================================================== */

    function focusablesIn(
        root
    ) {

        return [
            ...root.querySelectorAll(
                "button,input,select,[tabindex]:not([tabindex='-1'])"
            )
        ].filter(
            element =>
                !element.disabled &&
                element.offsetParent !== null
        );

    }

    function moveSpatialFocus(
        root,
        key
    ) {

        const items =
            focusablesIn(root);

        if(!items.length)
            return;

        const active =
            root.contains(
                document.activeElement
            )
                ? document.activeElement
                : items[0];

        if(
            document.activeElement !==
            active
        ) {

            active.focus();
            return;

        }

        const rect =
            active.getBoundingClientRect();

        const cx =
            rect.left +
            rect.width / 2;

        const cy =
            rect.top +
            rect.height / 2;

        const direction =
            {
                ArrowLeft: [-1,0],
                ArrowRight: [1,0],
                ArrowUp: [0,-1],
                ArrowDown: [0,1]
            }[key];

        if(!direction)
            return;

        let best = null;
        let bestScore = Infinity;

        for(const item of items) {

            if(item === active)
                continue;

            const itemRect =
                item.getBoundingClientRect();

            const ix =
                itemRect.left +
                itemRect.width / 2;

            const iy =
                itemRect.top +
                itemRect.height / 2;

            const dx =
                ix - cx;

            const dy =
                iy - cy;

            if(
                direction[0] &&
                Math.sign(dx) !== direction[0]
            )
                continue;

            if(
                direction[1] &&
                Math.sign(dy) !== direction[1]
            )
                continue;

            const primary =
                direction[0]
                    ? Math.abs(dx)
                    : Math.abs(dy);

            const secondary =
                direction[0]
                    ? Math.abs(dy)
                    : Math.abs(dx);

            const score =
                primary +
                secondary * 1.8;

            if(score < bestScore) {

                bestScore = score;
                best = item;

            }

        }

        if(best)
            best.focus();

    }

    function showPlayerHud() {

        const hud =
            $("playerHud");

        hud.classList.remove("hidden");

        clearTimeout(
            state.playerHudTimer
        );

        state.playerHudTimer =
            setTimeout(
                () =>
                    hidePlayerHud(),
                3500
            );

    }

    function hidePlayerHud() {

        const hud =
            $("playerHud");

        if(
            !hud ||
            document.querySelector(
                ".overlay.open"
            )
        )
            return;

        hud.classList.add("hidden");

    }

    function handleKeyboard(
        event
    ) {

        state.remoteMode = true;
        $("app").classList.add("remote-mode");

        const key =
            event.key || event.code;
        const code =
            event.code || "";

        const playerOpen =
            $("player")
                .classList
                .contains("open");

        const modalOpen =
            document.querySelector(
                ".overlay.open"
            );

        const drawerOpen =
            $("channelDrawer").classList.contains("open") ||
            $("infoDrawer").classList.contains("open");

        if(
            key === "Escape" ||
            key === "Backspace" ||
            code === "BrowserBack" ||
            key === "BrowserBack"
        ) {

            if(
                modalOpen
            ) {

                closeAllOverlays();
                return;

            }

            if(
                drawerOpen
            ) {

                if($("channelDrawer").classList.contains("open"))
                    toggleDrawer("channelDrawer", "channels");
                if($("infoDrawer").classList.contains("open"))
                    toggleDrawer("infoDrawer", "info");
                return;

            }

            if(
                playerOpen
            ) {

                const hud =
                    $("playerHud");

                if(
                    hud &&
                    !hud.classList.contains("hidden")
                ) {
                    hidePlayerHud();
                    return;
                }

                closePlayer();
                return;

            }

            return;

        }

        if(
            modalOpen
        ) {

            if(
                modalOpen.id === "guideOverlay" &&
                (key === "ArrowLeft" || key === "ArrowRight")
            ) {
                event.preventDefault();
                state.guideOffset +=
                    key === "ArrowRight" ? 1 : -1;
                state.guideOffset = Math.max(
                    -24,
                    Math.min(24, state.guideOffset)
                );
                updateGuide();
                return;
            }

            if(
                [
                    "ArrowLeft",
                    "ArrowRight",
                    "ArrowUp",
                    "ArrowDown"
                ].includes(
                    key
                )
            ) {

                event.preventDefault();
                moveSpatialFocus(
                    modalOpen,
                    event.key
                );

            }

            else if(
                key === "Enter" ||
                key === "NumpadEnter"
            ) {

                const active =
                    document.activeElement;

                if(
                    active &&
                    active !==
                    document.body &&
                    active.tagName !==
                    "INPUT"
                ) {

                    event.preventDefault();
                    active.click();

                }

            }

            return;
        }

        if(drawerOpen) {

            if(
                [
                    "ArrowLeft",
                    "ArrowRight",
                    "ArrowUp",
                    "ArrowDown"
                ].includes(key)
            ) {
                event.preventDefault();
                moveSpatialFocus(
                    $("channelDrawer"),
                    key
                );
            }
            else if(
                key === "Enter" ||
                key === "NumpadEnter"
            ) {
                event.preventDefault();
                document.activeElement?.click();
            }

            return;

        }

        if(
            playerOpen
        ) {

            if(
                code === "MediaNextTrack" ||
                key === "MediaNextTrack"
            ) {
                event.preventDefault();
                switchChannel(1);
                return;
            }

            if(
                code === "MediaPreviousTrack" ||
                key === "MediaPreviousTrack"
            ) {
                event.preventDefault();
                switchChannel(-1);
                return;
            }

            if(
                key === "ArrowLeft"
            ) {

                event.preventDefault();
                showPlayerHud();
                $("video").currentTime -= 10;

            }

            else if(
                key === "ArrowRight"
            ) {

                event.preventDefault();
                showPlayerHud();
                $("video").currentTime += 10;

            }

            else if(
                key === "ArrowUp"
            ) {

                event.preventDefault();
                showPlayerHud();
                switchChannel(-1);

            }

            else if(
                key === "ArrowDown"
            ) {

                event.preventDefault();
                showPlayerHud();
                switchChannel(1);

            }

            else if(
                key === "Enter" ||
                key === "NumpadEnter" ||
                key === " " ||
                code === "MediaPlayPause"
            ) {

                event.preventDefault();
                showPlayerHud();
                $("playerPlay").click();

            }

            else if(
                code === "MediaPlay" ||
                key === "p" ||
                key === "P"
            ) {
                event.preventDefault();
                $("video").play().catch(() => {});
            }

            else if(
                code === "MediaPause" ||
                key === "k" ||
                key === "K"
            ) {
                event.preventDefault();
                $("video").pause();
            }

            else if(
                code === "AudioVolumeUp" ||
                key === "AudioVolumeUp" ||
                key === "+"
            ) {
                event.preventDefault();
                const next = Math.min(1, $("video").volume + 0.1);
                $("video").volume = next;
                $("video").muted = false;
                $("volume").value = String(next);
                updateMuteIcon();
            }

            else if(
                code === "AudioVolumeDown" ||
                key === "AudioVolumeDown" ||
                key === "-"
            ) {
                event.preventDefault();
                const next = Math.max(0, $("video").volume - 0.1);
                $("video").volume = next;
                $("video").muted = next === 0;
                $("volume").value = String(next);
                updateMuteIcon();
            }

            else if(
                code === "AudioVolumeMute" ||
                key === "AudioVolumeMute" ||
                key === "m" ||
                key === "M"
            ) {

                event.preventDefault();
                $("mute").click();

            }

            else if(
                code === "MediaStop" ||
                key === "MediaStop"
            ) {

                event.preventDefault();
                closePlayer();

            }

            else if(
                key === "f" ||
                key === "F"
            ) {

                event.preventDefault();
                if(document.fullscreenElement)
                    document.exitFullscreen();
                else
                    $("player").requestFullscreen().catch(() => {});

            }

            return;

        }

        switch(
            key
        ) {

            case "ArrowLeft":

                event.preventDefault();

                navigate(
                    -1,
                    0
                );

                break;

            case "ArrowRight":

                event.preventDefault();

                navigate(
                    1,
                    0
                );

                break;

            case "ArrowUp":

                event.preventDefault();

                navigate(
                    0,
                    -1
                );

                break;

            case "ArrowDown":

                event.preventDefault();

                navigate(
                    0,
                    1
                );

                break;

            case "Enter":
            case "NumpadEnter":

                event.preventDefault();

                if(state.current)
                    openPlayer(
                        state.current
                    );

                break;

            case "Home":

                event.preventDefault();

                document
                    .querySelector(
                        ".nav-button"
                    )
                    ?.focus();

                break;

            case "/":

                openOverlay(
                    "searchOverlay"
                );

                setTimeout(
                    () =>
                        $("searchInput")
                            .focus(),
                    30
                );

                break;

            case "g":
            case "G":

                openOverlay(
                    "guideOverlay"
                );

                break;

        }

    }

    /* ========================================================
       CHANNEL SWITCHING
       ======================================================== */

    function switchChannel(
        direction
    ) {

        if(!state.current)
            return;

        const pool =
            state.channels.filter(
                channel =>
                    channel.status === "online"
            );

        if(!pool.length)
            return;

        const index =
            pool.findIndex(
                channel =>
                    channel.id ===
                    state.current.id
            );

        const start =
            index >= 0 ? index : 0;

        for(
            let offset = 1;
            offset <= pool.length;
            offset++
        ) {

            const nextIndex =
                (start + direction * offset + pool.length) %
                pool.length;

            const next =
                pool[nextIndex];

            if(next && next.id !== state.current.id) {
                openPlayer(next);
                return;
            }

        }

    }

    /* ========================================================
       PLAYER STATE
       ======================================================== */

    function updatePlayIcon() {

        const icon =
            $("video").paused
                ? "play"
                : "pause";

        $("playerPlay").innerHTML =
            `<i data-lucide="${icon}"></i>`;

        lucide.createIcons();

    }

    function updateMuteIcon() {

        const icon =
            $("video").muted ||
            $("video").volume === 0
                ? "volume-x"
                : "volume-2";

        $("mute").innerHTML =
            `<i data-lucide="${icon}"></i>`;

        lucide.createIcons();

    }

    function updateProgress() {

        const video =
            $("video");

        if(
            !video.duration ||
            !isFinite(
                video.duration
            )
        )
            return;

        $("progressFill")
            .style.width =
            (
                video.currentTime /
                video.duration *
                100
            ) +
            "%";

    }

    function closePlayer() {

        ++state.playbackSession;

        if(state.playbackAbort) {
            state.playbackAbort.abort();
            state.playbackAbort = null;
        }

        stopRecording();

        destroyHLS();

        const video =
            $("video");

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

        $("player")
            .classList.remove(
                "open"
            );

        $("channelDrawer")
            .classList.remove(
                "open"
            );

        $("infoDrawer")
            .classList.remove(
                "open"
            );

        hidePlayerHud();

        if(
            state.lastPlaybackChannel
        )
            state.current =
                state.lastPlaybackChannel;

        if(
            state.lastFocusBeforePlayer &&
            typeof state.lastFocusBeforePlayer.focus === "function"
        ) {
            requestAnimationFrame(
                () =>
                    state.lastFocusBeforePlayer.focus()
            );
        }

    }

    /* ========================================================
       SEARCH UI
       ======================================================== */

    function renderSearch(
        query
    ) {

        const container =
            $("searchResults");
        const scrollTop =
            container.scrollTop;
        const scrollLeft =
            container.scrollLeft;

        const results =
            searchChannels(
                query
            );

        container.innerHTML = "";

        const fragment =
            document.createDocumentFragment();

        results.forEach(
            (channel,index) => {

                const card =
                    createCard(
                        channel,
                        index,
                        0
                    );

                card.style.width =
                    "100%";

                card.style.height =
                    "135px";

                fragment.appendChild(
                    card
                );

            }
        );

        container.appendChild(
            fragment
        );

        requestAnimationFrame(
            () => {
                container.scrollTop = scrollTop;
                container.scrollLeft = scrollLeft;
            }
        );

    }

    /* ========================================================
       STARTUP
       ======================================================== */

    function init() {

        bindEvents();

        lucide.createIcons();

        const savedVolume =
            Number(
                localStorage.getItem(
                    "xvynora-volume"
                ) || "0.8"
            );

        state.volume =
            Number.isFinite(savedVolume)
                ? savedVolume
                : 0.8;

        $("video").volume =
            state.volume;
        $("volume").value =
            String(state.volume);
        updateMuteIcon();
        updateWorkingOnlyChip();

        loadThreadfinChannels();

        setInterval(
            updateStreamInfo,
            2000
        );

    }

    return {
        init,
        loadIPTVOrg,
        parseM3U,
        mergeChannels
    };

})();

App.init();
</script>



<script>
/* XVYNORA: preload real IPTV-org catalogue */
(async () => {
  try {
    const sources = [
      "https://iptv-org.github.io/iptv/channels.json",
      "https://iptv-org.github.io/iptv/streams.json"
    ];

    const [channelsRes, streamsRes] = await Promise.all(
      sources.map(u => fetch(u, {cache:"no-store"}))
    );

    if (!channelsRes.ok || !streamsRes.ok) throw new Error("IPTV-org unavailable");

    const [channels, streams] = await Promise.all([
      channelsRes.json(),
      streamsRes.json()
    ]);

    const streamMap = new Map();

    for (const stream of streams) {
      const id = String(stream.channel || "").trim();
      const url = String(stream.url || "").trim();
      if (!id || !url) continue;

      if (!streamMap.has(id)) streamMap.set(id, []);
      streamMap.get(id).push(stream);
    }

    const realChannels = channels
      .map(ch => {
        const id = String(ch.id || "").trim();
        const mirrors = streamMap.get(id) || [];
        const stream = mirrors.find(x => /^https?:\/\//i.test(x.url));

        if (!stream) return null;

        return {
          id,
          title: ch.name || id,
          name: ch.name || id,
          logo: ch.logo || "",
          country: ch.country || "",
          language: Array.isArray(ch.languages) ? ch.languages.join(", ") : (ch.languages || ""),
          group: ch.categories?.[0] || "Live TV",
          category: ch.categories?.[0] || "Live TV",
          stream: stream.url,
          url: stream.url,
          source: "IPTV-org",
          health: "unknown",
          status: "unknown",
          quality: stream.quality || "",
          tvgId: id
        };
      })
      .filter(Boolean);

    window.XVYNORA_IPTV_ORG_CHANNELS = realChannels;

    /* Feed the existing application's channel collection when available. */
    if (Array.isArray(window.channels)) {
      window.channels.push(...realChannels);
    } else {
      window.channels = realChannels;
    }

    if (typeof mergeChannels === "function") {
      try { mergeChannels(realChannels); } catch (_) {}
    }

    if (typeof renderShelves === "function") {
      try { renderShelves(); } catch (_) {}
    }

    if (typeof renderSearch === "function") {
      try { renderSearch(); } catch (_) {}
    }

    if (typeof buildSearchIndex === "function") {
      try { buildSearchIndex(); } catch (_) {}
    }

    if (typeof toast === "function") {
      toast(`${realChannels.length.toLocaleString()} IPTV-org channels loaded`);
    }

    console.log(`[XVYNORA] Loaded ${realChannels.length} real IPTV-org channels`);
  } catch (err) {
    console.error("[XVYNORA] IPTV-org catalogue failed:", err);
  }
})();
</script>
