    /* ========================================================
       KEYBOARD
       ======================================================== */

    function focusablesIn(
        root
    ) {

        return [
            ...root.querySelectorAll(
                "button,input,select,[tabindex]:not([tabindex='-1'])"
            )
        ].filter(
            element =>
                !element.disabled &&
                element.offsetParent !== null
        );

    }

    function moveSpatialFocus(
        root,
        key
    ) {

        const items =
            focusablesIn(root);

        if(!items.length)
            return;

        const active =
            root.contains(
                document.activeElement
            )
                ? document.activeElement
                : items[0];

        if(
            document.activeElement !==
            active
        ) {

            active.focus();
            return;

        }

        const rect =
            active.getBoundingClientRect();

        const cx =
            rect.left +
            rect.width / 2;

        const cy =
            rect.top +
            rect.height / 2;

        const direction =
            {
                ArrowLeft: [-1,0],
                ArrowRight: [1,0],
                ArrowUp: [0,-1],
                ArrowDown: [0,1]
            }[key];

        if(!direction)
            return;

        let best = null;
        let bestScore = Infinity;

        for(const item of items) {

            if(item === active)
                continue;

            const itemRect =
                item.getBoundingClientRect();

            const ix =
                itemRect.left +
                itemRect.width / 2;

            const iy =
                itemRect.top +
                itemRect.height / 2;

            const dx =
                ix - cx;

            const dy =
                iy - cy;

            if(
                direction[0] &&
                Math.sign(dx) !== direction[0]
            )
                continue;

            if(
                direction[1] &&
                Math.sign(dy) !== direction[1]
            )
                continue;

            const primary =
                direction[0]
                    ? Math.abs(dx)
                    : Math.abs(dy);

            const secondary =
                direction[0]
                    ? Math.abs(dy)
                    : Math.abs(dx);

            const score =
                primary +
                secondary * 1.8;

            if(score < bestScore) {

                bestScore = score;
                best = item;

            }

        }

        if(best)
            best.focus();

    }

    function handleKeyboard(
        event
    ) {

        const playerOpen =
            $("player")
                .classList
                .contains("open");

        const modalOpen =
            document.querySelector(
                ".overlay.open"
            );

        if(
            event.key ===
            "Escape" ||
            event.key ===
            "Backspace"
        ) {

            if(
                modalOpen
            ) {

                closeAllOverlays();
                return;

            }

            if(
                playerOpen
            ) {

                closePlayer();
                return;

            }

            return;

        }

        if(
            modalOpen
        ) {

            if(
                [
                    "ArrowLeft",
                    "ArrowRight",
                    "ArrowUp",
                    "ArrowDown"
                ].includes(
                    event.key
                )
            ) {

                event.preventDefault();
                moveSpatialFocus(
                    modalOpen,
                    event.key
                );

            }

            else if(
                event.key ===
                "Enter"
            ) {

                const active =
                    document.activeElement;

                if(
                    active &&
                    active !==
                    document.body &&
                    active.tagName !==
                    "INPUT"
                ) {

                    event.preventDefault();
                    active.click();

                }

            }

            return;
        }

        if(
            playerOpen
        ) {

            if(
                event.key ===
                "ArrowLeft"
            ) {

                event.preventDefault();

                $("video").currentTime -=
                    10;

            }

            else if(
                event.key ===
                "ArrowRight"
            ) {

                event.preventDefault();

                $("video").currentTime +=
                    10;

            }

            else if(
                event.key ===
                "ArrowUp"
            ) {

                event.preventDefault();

                switchChannel(
                    -1
                );

            }

            else if(
                event.key ===
                "ArrowDown"
            ) {

                event.preventDefault();

                switchChannel(
                    1
                );

            }

            else if(
                event.key ===
                " "
            ) {

                event.preventDefault();

                $("playerPlay").click();

            }

            return;

        }

        switch(
            event.key
        ) {

            case "ArrowLeft":

                event.preventDefault();

                navigate(
                    -1,
                    0
                );

                break;

            case "ArrowRight":

                event.preventDefault();

                navigate(
                    1,
                    0
                );

                break;

            case "ArrowUp":

                event.preventDefault();

                navigate(
                    0,
                    -1
                );

                break;

            case "ArrowDown":

                event.preventDefault();

                navigate(
                    0,
                    1
                );

                break;

            case "Enter":

                event.preventDefault();

                if(state.current)
                    openPlayer(
                        state.current
                    );

                break;

            case "Home":

                event.preventDefault();

                document
                    .querySelector(
                        ".nav-button"
                    )
                    ?.focus();

                break;

            case "/":

                openOverlay(
                    "searchOverlay"
                );

                setTimeout(
                    () =>
                        $("searchInput")
                            .focus(),
                    30
                );

                break;

            case "g":
            case "G":

                openOverlay(
                    "guideOverlay"
                );

                break;

        }

    }

    /* ========================================================
       CHANNEL SWITCHING
       ======================================================== */

    function switchChannel(
        direction
    ) {

        if(!state.current)
            return;

        const index =
            state.filtered.findIndex(
                channel =>
                    channel.id ===
                    state.current.id
            );

        if(index < 0)
            return;

        const next =
            state.filtered[
                Math.max(
                    0,
                    Math.min(
                        state.filtered.length - 1,
                        index + direction
                    )
                )
            ];

        if(next)
            openPlayer(
                next
            );

    }

    /* ========================================================
       PLAYER STATE
       ======================================================== */

    function updatePlayIcon() {

        const icon =
            $("video").paused
                ? "play"
                : "pause";

        $("playerPlay").innerHTML =
            `<i data-lucide="${icon}"></i>`;

        lucide.createIcons();

    }

    function updateMuteIcon() {

        const icon =
            $("video").muted ||
            $("video").volume === 0
                ? "volume-x"
                : "volume-2";

        $("mute").innerHTML =
            `<i data-lucide="${icon}"></i>`;

        lucide.createIcons();

    }

    function updateProgress() {

        const video =
            $("video");

        if(
            !video.duration ||
            !isFinite(
                video.duration
            )
        )
            return;

        $("progressFill")
            .style.width =
            (
                video.currentTime /
                video.duration *
                100
            ) +
            "%";

    }

    function closePlayer() {

        stopRecording();

        destroyHLS();

        const video =
            $("video");

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

        $("player")
            .classList.remove(
                "open"
            );

        $("channelDrawer")
            .classList.remove(
                "open"
            );

        $("infoDrawer")
            .classList.remove(
                "open"
            );

        state.current =
            null;

    }

    /* ========================================================
       SEARCH UI
       ======================================================== */

    function renderSearch(
        query
    ) {

        const results =
            searchChannels(
                query
            );

        const container =
            $("searchResults");

        container.innerHTML = "";

        const fragment =
            document.createDocumentFragment();

        results.forEach(
            (channel,index) => {

                const card =
                    createCard(
                        channel,
                        index,
                        0
                    );

                card.style.width =
                    "100%";

                card.style.height =
                    "135px";

                fragment.appendChild(
                    card
                );

            }
        );

        container.appendChild(
            fragment
        );

    }

    /* ========================================================
       STARTUP
       ======================================================== */

    function init() {

        bindEvents();

        lucide.createIcons();

        loadThreadfinChannels();

        setInterval(
            updateStreamInfo,
            2000
        );

    }

    return {
        init,
        loadIPTVOrg,
        parseM3U,
        mergeChannels
    };

})();

App.init();
</script>
