<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>XVynora TV</title>

<!-- Runtime dependencies -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* ============================================================
   XVYNORA TV
   tvOS / Liquid Glass Design System
   Zero-build single-file application
   ============================================================ */

:root {
    --bg: #080808;
    --bg2: #101010;
    --white: #fff;
    --muted: rgba(255,255,255,.62);
    --muted2: rgba(255,255,255,.42);

    --glass:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.035)
        );

    --glass-dark: rgba(16,16,18,.72);

    --border: rgba(255,255,255,.18);
    --border-bright: rgba(255,255,255,.28);

    --blue: #2997ff;
    --green: #30d158;
    --yellow: #ffd60a;
    --red: #ff453a;

    --radius: 22px;

    --spring:
        cubic-bezier(.175,.885,.32,1.275);

    --smooth:
        cubic-bezier(.25,.46,.45,.94);

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------------- RESET ---------------- */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    color: inherit;
}

button:focus,
input:focus,
select:focus {
    outline: none;
}

/* ---------------- APPLICATION ---------------- */

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
}

#ambient {
    position: absolute;
    inset: -15%;
    z-index: -5;
    width: 130%;
    height: 130%;
    filter: blur(100px) saturate(150%);
    opacity: .42;
    pointer-events: none;
    transition: background 1s var(--smooth);
    background:
        radial-gradient(
            circle at 30% 35%,
            rgba(41,151,255,.24),
            transparent 34%
        ),
        radial-gradient(
            circle at 75% 65%,
            rgba(160,80,255,.16),
            transparent 32%
        );
}

/* ---------------- BACKDROP ---------------- */

#backdrop {
    position: absolute;
    inset: 0;
    z-index: -4;
    overflow: hidden;
    background: #050505;
}

.backdrop-image {
    position: absolute;
    inset: -4%;
    width: 108%;
    height: 108%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.055);
    transition:
        opacity .7s ease,
        transform 1.3s var(--smooth);
    filter: saturate(1.08);
}

.backdrop-image.active {
    opacity: .78;
    transform: scale(1);
}

#backdrop::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(5,5,5,.96) 0%,
            rgba(5,5,5,.72) 31%,
            rgba(5,5,5,.25) 67%,
            rgba(5,5,5,.5) 100%
        ),
        linear-gradient(
            to bottom,
            rgba(5,5,5,.52),
            transparent 30%,
            rgba(5,5,5,.94) 92%,
            #080808 100%
        );
}

/* ---------------- NAVIGATION ---------------- */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 92px;
    padding:
        calc(12px + var(--safe-top))
        4.5vw
        12px;

    z-index: 50;

    display: flex;
    align-items: center;
    gap: 34px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            transparent
        );
}

.brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .18em;
    white-space: nowrap;
}

.nav {
    display: flex;
    gap: 6px;
}

.nav-button {
    padding: 10px 17px;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition:
        background .2s,
        color .2s,
        transform .2s var(--spring);
}

.nav-button.active {
    background: rgba(255,255,255,.12);
    color: white;
}

.nav-button:hover,
.nav-button:focus {
    background: rgba(255,255,255,.16);
    color: white;
    transform: scale(1.06);
}

.nav-spacer {
    flex: 1;
}

.icon-button {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background: var(--glass);
    border: 1px solid var(--border);

    backdrop-filter:
        blur(45px)
        saturate(200%)
        contrast(105%);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.45),
        inset 0 -1px 1px rgba(0,0,0,.35);

    cursor: pointer;

    transition:
        transform .2s var(--spring),
        background .2s;
}

.icon-button:hover,
.icon-button:focus {
    transform: scale(1.1);
    background: rgba(255,255,255,.18);
}

/* ---------------- HERO ---------------- */

.hero {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 56vh;

    z-index: 10;

    display: flex;
    align-items: flex-end;

    padding:
        0
        4.5vw
        54px;
}

.hero-content {
    width: min(700px, 62vw);
}

.hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    margin-bottom: 12px;

    color: rgba(255,255,255,.68);
    font-size: 13px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: .14em;
}

.hero-title {
    margin: 0;

    font-size:
        clamp(48px, 6vw, 92px);

    line-height: .92;

    letter-spacing: -.06em;
}

.hero-description {
    margin: 20px 0 26px;

    max-width: 650px;

    color: rgba(255,255,255,.7);

    font-size: 18px;
    line-height: 1.5;
}

.hero-meta {
    display: flex;
    gap: 12px;

    margin-bottom: 18px;

    color: rgba(255,255,255,.58);
    font-size: 13px;
}

.hero-actions {
    display: flex;
    gap: 12px;
}

.hero-action {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 13px 21px;

    border-radius: 15px;

    cursor: pointer;

    transition:
        transform .2s var(--spring),
        background .2s;
}

.hero-action.primary {
    background: white;
    color: black;
}

.hero-action.secondary {
    background: rgba(255,255,255,.1);
    border: 1px solid var(--border);
    backdrop-filter: blur(30px) saturate(180%);
}

.hero-action:hover,
.hero-action:focus {
    transform: scale(1.06);
}

/* ---------------- CONTENT ---------------- */

.content {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 52vh;

    padding:
        52px
        4.5vw
        45px;

    z-index: 20;

    overflow: hidden;

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0,
            black 11%,
            black 100%
        );
}

.content-inner {
    width: 100%;
    height: 100%;

    transition:
        transform .5s var(--smooth);
}

/* ---------------- SHELVES ---------------- */

.shelf {
    margin-bottom: 35px;
}

.shelf-heading {
    display: flex;
    align-items: baseline;
    gap: 12px;

    margin-bottom: 14px;
}

.shelf-title {
    margin: 0;

    font-size: 24px;
    letter-spacing: -.025em;
}

.shelf-count {
    color: var(--muted2);
    font-size: 12px;
}

.shelf-viewport {
    overflow: visible;
}

.shelf-row {
    display: flex;
    gap: 18px;

    width: max-content;

    transform: translate3d(0,0,0);

    transition:
        transform .38s var(--smooth);

    will-change: transform;
}

/* ---------------- CHANNEL CARD ---------------- */

.card {
    position: relative;

    width: 235px;
    height: 145px;

    flex: 0 0 auto;

    overflow: hidden;

    border-radius: 20px;

    background: #171717;

    border: 1px solid rgba(255,255,255,.08);

    transform:
        translate3d(0,0,0)
        perspective(1000px)
        rotateX(0deg)
        rotateY(0deg)
        scale(1);

    transition:
        transform .28s var(--spring),
        box-shadow .28s var(--smooth),
        border-color .28s;

    will-change: transform;

    cursor: pointer;
}

.card.focused {
    z-index: 100;

    transform:
        translate3d(0,-4px,0)
        perspective(1000px)
        rotateX(var(--rx,0deg))
        rotateY(var(--ry,0deg))
        scale(1.16);

    border-color:
        rgba(255,255,255,.95);

    box-shadow:
        0 32px 65px rgba(0,0,0,.82),
        0 0 0 3px white,
        0 0 60px var(--card-glow,rgba(41,151,255,.15));
}

.card-image {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transition:
        transform .5s var(--smooth),
        filter .5s;
}

.card.focused .card-image {
    transform: scale(1.08);
    filter: saturate(1.08);
}

.card::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            transparent 45%,
            rgba(0,0,0,.92)
        );

    pointer-events: none;
}

.card-reflection {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at var(--lx,50%) var(--ly,20%),
            rgba(255,255,255,.38),
            transparent 30%
        );

    opacity: 0;

    transition: opacity .2s;
}

.card.focused .card-reflection {
    opacity: 1;
}

.card-info {
    position: absolute;

    left: 15px;
    right: 15px;
    bottom: 13px;

    z-index: 3;
}

.card-title {
    font-size: 16px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-subtitle {
    display: flex;
    align-items: center;
    gap: 7px;

    margin-top: 5px;

    color: rgba(255,255,255,.62);
    font-size: 11px;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--yellow);
}

.status-dot.online {
    background: var(--green);
}

.status-dot.offline {
    background: var(--red);
}

.status-dot.probing {
    background: var(--yellow);
}

/* ---------------- LOGO ---------------- */

.channel-logo {
    position: absolute;

    top: 14px;
    left: 14px;

    width: 52px;
    height: 52px;

    object-fit: contain;

    padding: 7px;

    border-radius: 14px;

    background: rgba(0,0,0,.38);

    backdrop-filter: blur(20px);

    z-index: 4;
}

/* ---------------- FILTER BAR ---------------- */

.filter-bar {
    position: absolute;

    left: 4.5vw;
    right: 4.5vw;

    bottom: 13px;

    z-index: 45;

    display: flex;
    align-items: center;
    gap: 8px;
}

.filter-chip {
    padding: 8px 13px;

    border-radius: 999px;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.1);

    color: var(--muted);

    font-size: 12px;

    cursor: pointer;

    backdrop-filter: blur(25px);

    transition:
        transform .2s var(--spring),
        background .2s,
        color .2s;
}

.filter-chip.active {
    background: white;
    color: black;
}

.filter-chip:hover,
.filter-chip:focus {
    transform: scale(1.06);
}

/* ---------------- GLASS MODALS ---------------- */

.overlay {
    position: absolute;
    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.58);

    backdrop-filter:
        blur(24px)
        saturate(140%);
}

.overlay.open {
    display: flex;
}

.glass-panel {
    width: min(1200px, 90vw);
    max-height: 84vh;

    overflow: hidden;

    padding: 28px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.035)
        );

    border: 1px solid rgba(255,255,255,.25);

    backdrop-filter:
        blur(45px)
        saturate(200%)
        contrast(105%);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.6),
        inset 0 -1px 1px rgba(0,0,0,.3),
        0 40px 120px rgba(0,0,0,.72);
}

.panel-header {
    display: flex;
    align-items: center;

    margin-bottom: 20px;
}

.panel-title {
    margin: 0;

    font-size: 31px;
    letter-spacing: -.035em;
}

.panel-close {
    margin-left: auto;
}

/* ---------------- SEARCH ---------------- */

.search-panel {
    width: min(1100px, 90vw);
}

.search-input {
    width: 100%;

    padding: 14px 0 20px;

    background: transparent;

    border: 0;
    border-bottom: 1px solid var(--border);

    color: white;

    font-size: 48px;
    letter-spacing: -.04em;
}

.search-input::placeholder {
    color: rgba(255,255,255,.27);
}

.search-results {
    height: 360px;

    margin-top: 25px;

    overflow: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px,1fr)
        );

    gap: 14px;

    scrollbar-width: none;
}

/* ---------------- GUIDE ---------------- */

.guide-container {
    height: 60vh;
    overflow: auto;
    scrollbar-width: none;
}

.guide-grid {
    display: grid;

    grid-template-columns:
        190px
        repeat(6,minmax(180px,1fr));

    min-width: 1250px;
}

.guide-head {
    position: sticky;
    top: 0;

    z-index: 3;

    padding: 12px;

    background: rgba(0,0,0,.42);

    backdrop-filter: blur(20px);

    border-bottom: 1px solid var(--border);

    font-size: 12px;

    color: var(--muted);
}

.guide-channel {
    position: sticky;
    left: 0;

    z-index: 2;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px;

    background:
        rgba(10,10,10,.72);

    backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.guide-program {
    margin: 5px;

    padding: 13px;

    min-height: 75px;

    border-radius: 13px;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.08);

    cursor: pointer;

    transition:
        background .2s,
        transform .2s var(--spring);
}

.guide-program.now {
    background: rgba(41,151,255,.18);
    border-color: rgba(41,151,255,.4);
}

.guide-program:hover,
.guide-program:focus {
    transform: scale(1.025);
    background: rgba(255,255,255,.13);
}

.program-title {
    font-weight: 650;
}

.program-time {
    margin-top: 5px;

    color: var(--muted2);

    font-size: 11px;
}

/* ---------------- PLAYER ---------------- */

#player {
    position: absolute;
    inset: 0;

    z-index: 500;

    display: none;

    background: #000;
}

#player.open {
    display: block;
}

#video {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;
}

#video.fill {
    object-fit: cover;
}

#video.native {
    object-fit: contain;
}

#video.ratio-16-9 {
    object-fit: contain;
    aspect-ratio: 16 / 9;
}

#video.ratio-4-3 {
    object-fit: contain;
    aspect-ratio: 4 / 3;
}

#video.zoom {
    object-fit: cover;
    transform: scale(1.13);
}

/* ---------------- PLAYER HUD ---------------- */

.player-hud {
    position: absolute;

    left: 4vw;
    right: 4vw;
    bottom: 4vh;

    z-index: 10;

    padding: 18px;

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.045)
        );

    border: 1px solid rgba(255,255,255,.22);

    backdrop-filter:
        blur(45px)
        saturate(200%);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.55),
        0 25px 80px rgba(0,0,0,.7);

    opacity: 0;

    transform: translateY(20px);

    transition:
        opacity .3s,
        transform .3s var(--spring);
}

#player:hover .player-hud,
#player.controls-visible .player-hud {
    opacity: 1;
    transform: translateY(0);
}

.player-top {
    display: flex;
    align-items: center;
    gap: 15px;
}

.player-channel-title {
    font-size: 22px;
    font-weight: 750;
}

.player-program {
    color: var(--muted);
    font-size: 13px;
}

.player-controls {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-top: 15px;
}

.player-control {
    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: rgba(255,255,255,.1);

    border: 1px solid rgba(255,255,255,.12);

    cursor: pointer;

    transition:
        transform .2s var(--spring),
        background .2s;
}

.player-control:hover,
.player-control:focus {
    transform: scale(1.1);
    background: rgba(255,255,255,.2);
}

.player-spacer {
    flex: 1;
}

.player-select {
    padding: 10px 13px;

    border-radius: 12px;

    background: rgba(255,255,255,.1);

    color: white;

    border: 1px solid var(--border);
}

.player-progress {
    height: 4px;

    margin-top: 15px;

    overflow: hidden;

    border-radius: 99px;

    background: rgba(255,255,255,.12);
}

.player-progress-fill {
    height: 100%;
    width: 0;

    background: white;

    transition: width .2s linear;
}

/* ---------------- INFO DRAWER ---------------- */

.info-drawer,
.channel-drawer {
    position: absolute;

    top: 0;
    bottom: 0;

    width: min(430px,90vw);

    z-index: 30;

    padding: 35px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.04)
        );

    backdrop-filter:
        blur(45px)
        saturate(180%);

    border-left: 1px solid var(--border);

    box-shadow: -30px 0 100px rgba(0,0,0,.45);

    transform: translateX(105%);

    transition:
        transform .4s var(--smooth);
}

.info-drawer.open,
.channel-drawer.open {
    transform: translateX(0);
}

.info-drawer {
    right: 0;
}

.channel-drawer {
    left: 0;

    transform:
        translateX(-105%);

    border-left: 0;
    border-right: 1px solid var(--border);
}

.channel-drawer.open {
    transform: translateX(0);
}

.drawer-heading {
    display: flex;
    align-items: center;

    margin-bottom: 25px;
}

.drawer-heading h2 {
    margin: 0;
}

.drawer-close {
    margin-left: auto;
}

.info-row {
    display: flex;
    justify-content: space-between;

    padding: 13px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.info-label {
    color: var(--muted);
}

.info-value {
    font-weight: 600;
}

/* ---------------- SETTINGS / IMPORT ---------------- */

.form {
    display: grid;
    gap: 12px;

    max-height: 65vh;

    overflow: auto;
}

.field {
    display: grid;
    gap: 7px;
}

.field label {
    color: var(--muted);
    font-size: 12px;
}

.field input,
.field select {
    width: 100%;

    padding: 13px 15px;

    color: white;

    background: rgba(0,0,0,.25);

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 13px;

    outline: none;
}

.field input:focus,
.field select:focus {
    border-color: rgba(255,255,255,.5);
}

.form-actions {
    display: flex;
    gap: 10px;

    margin-top: 10px;
}

.glass-button {
    padding: 11px 16px;

    border-radius: 13px;

    background: rgba(255,255,255,.1);

    border:
        1px solid
        rgba(255,255,255,.14);

    cursor: pointer;

    transition:
        transform .2s var(--spring),
        background .2s;
}

.glass-button.primary {
    background: white;
    color: black;
}

.glass-button:hover,
.glass-button:focus {
    transform: scale(1.04);
    background: rgba(255,255,255,.18);
}

.glass-button.primary:hover,
.glass-button.primary:focus {
    background: white;
}

/* ---------------- RECORDING ---------------- */

.recording {
    position: absolute;

    top: 35px;
    left: 35px;

    z-index: 20;

    display: none;
    align-items: center;
    gap: 8px;

    padding: 8px 12px;

    border-radius: 999px;

    background: rgba(0,0,0,.5);

    backdrop-filter: blur(20px);

    font-size: 12px;
    font-weight: 700;
}

.recording.active {
    display: flex;
}

.record-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--red);

    animation:
        recordingPulse 1s infinite;
}

@keyframes recordingPulse {
    50% {
        opacity: .3;
    }
}

/* ---------------- TOAST ---------------- */

#toast {
    position: absolute;

    left: 50%;
    bottom: 35px;

    z-index: 900;

    transform:
        translate(-50%, 25px);

    opacity: 0;

    pointer-events: none;

    padding: 12px 17px;

    border-radius: 999px;

    background:
        rgba(20,20,20,.82);

    border: 1px solid var(--border);

    backdrop-filter: blur(30px);

<script>
"use strict";

/* ============================================================
   XVYNORA TV APPLICATION
   ============================================================ */

const App = (() => {

    const state = {

        channels: [],
        filtered: [],

        favorites:
            new Set(
                JSON.parse(
                    localStorage.getItem(
                        "xvynora-favorites"
                    ) || "[]"
                )
            ),

        filter: "all",
        workingOnly: false,

        rows: [],
        row: 0,
        col: 0,

        current: null,

        hls: null,

        backgroundIndex: 0,

        searchIndex: new Map(),

        searchTimer: null,

        epg: new Map(),

        recorder: null,
        recordedChunks: [],
        recordStarted: 0,
        recordTimer: null,

        audioContext: null

    };

    const $ = id =>
        document.getElementById(id);

    /* ========================================================
       HELPERS
       ======================================================== */

    function escapeHTML(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }

    function toast(message) {

        const el = $("toast");

        el.textContent = message;

        el.classList.add("show");

        clearTimeout(
            toast.timer
        );

        toast.timer =
            setTimeout(
                () =>
                    el.classList.remove("show"),
                2500
            );
    }

    function saveFavorites() {

        localStorage.setItem(
            "xvynora-favorites",
            JSON.stringify(
                [...state.favorites]
            )
        );

    }

    function normalizeUrl(url) {

        try {
            return new URL(
                url,
                location.href
            ).href;
        } catch {
            return url;
        }

    }

    /* ========================================================
       AUDIO FEEDBACK
       ======================================================== */

    function audio() {

        if(!state.audioContext) {

            state.audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        return state.audioContext;

    }

    function clickSound(
        frequency = 520,
        duration = .035
    ) {

        try {

            const ctx = audio();

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            const filter =
                ctx.createBiquadFilter();

            filter.type = "lowpass";
            filter.frequency.value = 1300;

            oscillator.type = "sine";
            oscillator.frequency.value =
                frequency;

            gain.gain.setValueAtTime(
                .0001,
                ctx.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .045,
                ctx.currentTime + .006
            );

            gain.gain.exponentialRampToValueAtTime(
                .0001,
                ctx.currentTime + duration
            );

            oscillator
                .connect(filter)
                .connect(gain)
                .connect(ctx.destination);

            oscillator.start();

            oscillator.stop(
                ctx.currentTime + duration
            );

        } catch {}

    }

    /* ========================================================
       IPTV M3U PARSER
       ======================================================== */

    function parseM3U(text) {

        const lines =
            text
                .replace(/\r/g,"")
                .split("\n");

        const result = [];

        let metadata = null;

        for(let i = 0; i < lines.length; i++) {

            const line =
                lines[i].trim();

            if(!line)
                continue;

            if(
                line.startsWith("#EXTINF")
            ) {

                metadata =
                    parseEXTINF(line);

                continue;
            }

            if(
                line.startsWith("#")
            ) {

                continue;
            }

            if(metadata) {

                const url =
                    line;

                result.push({

                    id:
                        metadata.id ||
                        createId(
                            metadata.name +
                            url
                        ),

                    title:
                        metadata.name ||
                        "Unknown Channel",

                    stream:
                        normalizeUrl(url),

                    logo:
                        metadata.logo || "",

                    category:
                        metadata.group || "Live TV",

                    group:
                        metadata.group || "Live TV",

                    language:
                        metadata.language || "",

                    country:
                        metadata.country || "",

                    tvgId:
                        metadata.tvgId || "",

                    quality:
                        metadata.quality || "",

                    status: "unknown",

                    programs: []

                });

                metadata = null;

            }

        }

        return result;

    }

    function parseEXTINF(line) {

        const attributes = {};

        const attributePattern =
            /([\w-]+)="([^"]*)"/g;

        let match;

        while(
            (match =
                attributePattern.exec(line))
        ) {

            attributes[
                match[1].toLowerCase()
            ] =
                match[2];

        }

        const comma =
            line.indexOf(",");

        const name =
            comma >= 0
                ? line
                    .slice(comma + 1)
                    .trim()
                : "Unknown Channel";

        const group =
            attributes[
                "group-title"
            ] || "";

        const qualityText =
            (
                group + " " + name
            ).toLowerCase();

        let quality = "";

        if(
            /\b(2160p|4k)\b/i
                .test(qualityText)
        )
            quality = "4K";
        else if(
            /\b1080p\b/i
                .test(qualityText)
        )
            quality = "1080p";
        else if(
            /\b720p\b/i
                .test(qualityText)
        )
            quality = "720p";
        else if(
            /\b480p\b/i
                .test(qualityText)
        )
            quality = "480p";

        return {

            name,

            id:
                attributes["tvg-id"] ||
                attributes["tvg-name"] ||
                "",

            logo:
                attributes["tvg-logo"] ||
                "",

            group,

            language:
                attributes["tvg-language"] ||
                "",

            country:
                attributes["tvg-country"] ||
                "",

            quality

        };

    }

    /* ========================================================
       ID / COLOR
       ======================================================== */

    function createId(value) {

        let hash = 0;

        for(
            let i = 0;
            i < value.length;
            i++
        ) {

            hash =
                (
                    (hash << 5) -
                    hash +
                    value.charCodeAt(i)
                ) |
                0;

        }

        return (
            "xv-" +
            Math.abs(hash)
        );

    }

    function colorFromString(value) {

        let hash = 0;

        for(
            let i = 0;
            i < value.length;
            i++
        ) {

            hash =
                value.charCodeAt(i) +
                ((hash << 5) - hash);

        }

        const h =
            Math.abs(hash) % 360;

        return `
            hsl(${h} 80% 58%)
        `;

    }

    /* ========================================================
       SEARCH INDEX
       ======================================================== */

    function buildSearchIndex() {

        state.searchIndex.clear();

        for(
            const channel of state.channels
        ) {

            const tokens =
                (
                    [
                        channel.title,
                        channel.group,
                        channel.category,
                        channel.country,
                        channel.language,
                        channel.quality
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase()
                )
                .split(
                    /[^a-z0-9]+/i
                )
                .filter(Boolean);

            for(
                const token of tokens
            ) {

                if(
                    !state.searchIndex.has(
                        token
                    )
                ) {

                    state.searchIndex.set(
                        token,
                        []
                    );

                }

                state.searchIndex
                    .get(token)
                    .push(channel);

            }

        }

    }

    function searchChannels(query) {

        const q =
            query
                .trim()
                .toLowerCase();

        if(!q)
            return state.channels.slice(0,60);

        const terms =
            q.split(
                /\s+/
            );

        const score =
            new Map();

        for(
            const channel of state.channels
        ) {

            const hay =
                [
                    channel.title,
                    channel.group,
                    channel.category,
                    channel.country,
                    channel.language,
                    channel.quality
                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

            let points = 0;

            for(
                const term of terms
            ) {

                if(
                    hay.startsWith(term)
                )
                    points += 8;

                else if(
                    hay.includes(term)
                )
                    points += 3;

            }

            if(points)
                score.set(
                    channel,
                    points
                );

        }

        return [...score.entries()]
            .sort(
                (a,b) =>
                    b[1] - a[1]
            )
            .slice(0,100)
            .map(
                x => x[0]
            );

    }

    /* ========================================================
       FILTERING
       ======================================================== */

    function applyFilters() {

        let channels =
            state.channels;

        if(
            state.filter !== "all"
        ) {

            const filter =
                state.filter
                    .toLowerCase();

            channels =
                channels.filter(
                    channel => {

                        const hay =
                            [
                                channel.title,
                                channel.group,
                                channel.category,
                                channel.country,
                                channel.language,
                                channel.quality
                            ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();

                        return hay.includes(
                            filter
                        );

                    }
                );

        }

        if(
            state.workingOnly
        ) {

            channels =
                channels.filter(
                    channel =>
                        channel.status ===
                        "online"
                );

        }

        state.filtered =
            channels;

        renderShelves();

    }

    /* ========================================================
       CARD
       ======================================================== */

    function createCard(
        channel,
        index,
        row
    ) {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "card";

        card.tabIndex = 0;

        card.dataset.row = row;
        card.dataset.col = index;
        card.dataset.id = channel.id;

        const fallback =
            colorFromString(
                channel.title
            );

        card.style.setProperty(
            "--card-glow",
            fallback
        );

        const status =
            channel.status ===
            "online"
                ? "online"
                : channel.status ===
                  "failed"
                    ? "offline"
                    : "probing";

        card.innerHTML = `

            ${
                channel.logo
                ? `
                    <img
                        class="channel-logo"
                        src="${escapeHTML(channel.logo)}"
                        alt=""
                        loading="lazy">
                `
                : ""
            }

            <div
                class="card-image"
                style="
                    background:
                    radial-gradient(
                        circle at 70% 20%,
                        ${fallback},
                        transparent 45%
                    ),
                    linear-gradient(
                        135deg,
                        #262626,
                        #090909
                    );
                ">
            </div>

            <div
                class="card-reflection">
            </div>

            <div class="card-info">

                <div class="card-title">
                    ${escapeHTML(
                        channel.title
                    )}
                </div>

                <div class="card-subtitle">

                    <span
                        class="status-dot ${status}">
                    </span>

                    ${
                        escapeHTML(
                            channel.quality ||
                            channel.group ||
                            "Live TV"
                        )
                    }

                </div>

            </div>
        `;

        card.addEventListener(
            "focus",
            () => {

                state.row = row;
                state.col = index;

                focusCard(card);

                updateHero(
                    channel
                );

                clickSound(
                    480 + row * 50
                );

            }
        );

        card.addEventListener(
            "click",
            () =>
                openPlayer(
                    channel
                )
        );

        card.addEventListener(
            "mousemove",
            event => {

                const rect =
                    card.getBoundingClientRect();

                const x =
                    (
                        event.clientX -
                        rect.left
                    ) /
                    rect.width;

                const y =
                    (
                        event.clientY -
                        rect.top
                    ) /
                    rect.height;

                card.style.setProperty(
                    "--rx",
                    ((.5 - y) * 9) +
                    "deg"
                );

                card.style.setProperty(
                    "--ry",
                    ((x - .5) * 9) +
                    "deg"
                );

                card.style.setProperty(
                    "--lx",
                    (x * 100) +
                    "%"
                );

                card.style.setProperty(
                    "--ly",
                    (y * 100) +
                    "%"
                );

            }
        );

        card.addEventListener(
            "mouseleave",
            () => {

                card.style.setProperty(
                    "--rx",
                    "0deg"
                );

                card.style.setProperty(
                    "--ry",
                    "0deg"
                );

            }
        );

        return card;

    }

    function renderShelves() {

        const channels =
            state.filter === "all" &&
            !state.workingOnly
                ? state.channels
                : state.filtered;

        const featured =
            channels.slice(0,40);

        const live =
            channels.slice(0,80);

        const sports =
            channels.filter(
                c =>
                    /sport/i.test(
                        (
                            c.title +
                            " " +
                            c.group +
                            " " +
                            c.category
                        )
                    )
            ).slice(0,80);

        const favorites =
            channels.filter(
                c =>
                    state.favorites.has(
                        c.id
                    )
            );

        const rows = [];

        if(favorites.length) {

            renderRow(
                $("favoritesRow"),
                favorites,
                rows.length
            );

            rows.push(
                favorites
            );

        } else {

            $("favoritesRow")
                .innerHTML = "";

        }

        renderRow(
            $("featuredRow"),
            featured,
            rows.length
        );

        rows.push(
            featured
        );

        renderRow(
            $("liveRow"),
            live,
            rows.length
        );

        rows.push(
            live
        );

        const sportsRow =
            sports.length
                ? sports
                : [];

        renderRow(
            $("sportsRow"),
            sportsRow,
            rows.length
        );

        rows.push(
            sportsRow
        );

        $("favoritesShelf").hidden =
            !favorites.length;

        $("featuredCount")
            .textContent =
            `${featured.length} channels`;

        $("liveCount")
            .textContent =
            `${live.length} channels`;

        $("sportsCount")
            .textContent =
            `${sports.length} channels`;

        $("favoritesCount")
            .textContent =
            `${favorites.length} channels`;

        state.rows =
            rows.filter(
                row =>
                    row.length
            );

        if(
            !state.rows.length
        ) {

            state.row = 0;
            state.col = 0;
            return;

        }

        state.row =
            Math.min(
                state.row,
                state.rows.length - 1
            );

        state.col = 0;

        buildSearchIndex();

        updateGuide();

    }

    function renderRow(
        container,
        channels,
        row
    ) {

        container.innerHTML = "";

        const fragment =
            document.createDocumentFragment();

        channels.forEach(
            (channel,index) => {

                fragment.appendChild(
                    createCard(
                        channel,
                        index,
                        row
                    )
                );

            }
        );

        container.appendChild(
            fragment
        );

    }

    /* ========================================================
       SPATIAL NAVIGATION
       ======================================================== */

    function cardAt(row,col) {

        return document.querySelector(
            `.card[data-row="${row}"][data-col="${col}"]`
        );

    }

    function focusCard(card) {

        if(!card)
            return;

        document.querySelectorAll(
            ".card.focused"
        ).forEach(
            x =>
                x.classList.remove(
                    "focused"
                )
        );

        card.classList.add(
            "focused"
        );

        card.focus({
            preventScroll: true
        });

        const shelf =
            card.closest(
                ".shelf"
            );

        if(shelf) {

            const row =
                card.parentElement;

            const rect =
                card.getBoundingClientRect();

            const viewport =
                row.parentElement
                    .getBoundingClientRect();

            let shift = 0;

            if(
                rect.right >
                viewport.right - 20
            ) {

                shift =
                    viewport.right -
                    rect.right -
                    25;

            }

            if(
                rect.left <
                viewport.left + 20
            ) {

                shift =
                    viewport.left -
                    rect.left +
                    25;

            }

            row.style.transform =
                `translate3d(${shift}px,0,0)`;

        }

        $("contentInner").style.transform =
            `translate3d(0,${
                state.row * -34
            }px,0)`;

    }

    function navigate(
        dx,
        dy
    ) {

        const rows =
            state.rows;

        if(!rows.length)
            return;

        let row =
            state.row + dy;

        row =
            Math.max(
                0,
                Math.min(
                    rows.length - 1,
                    row
                )
            );

        const data =
            rows[row];

        if(!data.length)
            return;

        let col =
            state.col + dx;

        col =
            Math.max(
                0,
                Math.min(
                    data.length - 1,
                    col
                )
            );

        state.row = row;
        state.col = col;

        const card =
            cardAt(
                row,
                col
            );

        if(card)
            focusCard(card);

    }

        if(!channel.logo)

        const active =
            state.backgroundIndex === 0
                ? $("bgA")
                : $("bgB");

        const next =
            state.backgroundIndex === 0
                ? $("bgB")
                : $("bgA");

        /*
         * IPTV-org metadata supplies logos rather than
         * guaranteed cinematic artwork. The logo is therefore
         * used as the backdrop only when appropriate.
         */
        next.src =
            channel.logo;

        active.classList.remove(
            "active"
        );

        next.classList.add(
            "active"
        );

        state.backgroundIndex =
            state.backgroundIndex
                ? 0
                : 1;

    }

    async function api(
        path,
        options = {}
    ) {

        const response =
            await fetch(
                `/xvynora/api/${path}`,
                options
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            data.status === false
        )
            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );

        return data;

    }

    async function postJSON(
        path,
        body = {}
    ) {

        return api(
            path,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body)
            }
        );

    /* ========================================================
       MERGE CHANNELS
       ======================================================== */

    function mergeChannels(
        incoming
    ) {

        const map =
            new Map(
                state.channels.map(
                    channel =>
                        [
                            channel.id ||
                            channel.stream,
                            channel
                        ]
                )
            );

        for(
            const channel of incoming
        ) {

            const key =
                channel.id ||
                channel.stream;

            if(
                map.has(key)
            ) {

                const old =
                    map.get(key);

                map.set(
                    key,
                    {
                        ...old,
                        ...channel
                    }
                );

            } else {

                map.set(
                    key,
                    channel
                );

            }

        }

        state.channels =
            [...map.values()];

        applyFilters();

        const first =
            state.channels[0];

        if(first) {

            updateHero(
                first
            );

            const firstCard =
                document.querySelector(
                    ".card"
                );

            if(firstCard)
                focusCard(
                    firstCard
                );

        }

    }

    /* ========================================================
       XTREAM
       ======================================================== */

    async function loadXtream() {

        const host =
            $("xtreamHost")
                .value
                .trim()
                .replace(/\/+$/,"");

        const username =
            $("xtreamUser")
                .value
                .trim();

        const password =
            $("xtreamPass")
                .value
                .trim();

        if(
            !host ||
            !username ||
            !password
        ) {

            toast(
                "Enter Xtream host, username and password"
            );

            return;

        }

        const api =
            `${host}/player_api.php?` +
            `username=${encodeURIComponent(username)}` +
            `&password=${encodeURIComponent(password)}`;

        try {

            const response =
                await fetch(api);

            if(!response.ok)
                throw new Error(
                    `HTTP ${response.status}`
                );

            const data =
                await response.json();

            if(
                data.user_info &&
                data.user_info.auth === 0
            )
                throw new Error(
                    "Xtream authentication failed"
                );

            const categories =
                await fetch(
                    `${api}&action=get_live_categories`
                )
                .then(
                    response =>
                        response.json()
                );

            const categoryMap =
                new Map(
                    categories.map(
                        category =>
                            [
                                String(
                                    category.category_id
                                ),
                                category.category_name
                            ]
                    )
                );

            const streams =
                await fetch(
                    `${api}&action=get_live_streams`
                )
                .then(
                    response =>
                        response.json()
                );

            const parsed =
                streams.map(
                    stream => {

                        const extension =
                            stream.container_extension ||
                            "m3u8";

                        const url =
                            `${host}/live/` +
                            `${encodeURIComponent(username)}/` +
                            `${encodeURIComponent(password)}/` +
                            `${stream.stream_id}.` +
                            extension;

                        return {

                            id:
                                String(
                                    stream.stream_id
                                ),

                            title:
                                stream.name ||
                                "Unknown Channel",

                            stream: url,

                            logo:
                                stream.stream_icon ||
                                "",

                            group:
                                categoryMap.get(
                                    String(
                                        stream.category_id
                                    )
                                ) ||
                                "Live TV",

                            category:
                                "Live TV",

                            language: "",
                            country: "",
                            quality: "",
                            status: "unknown",
                            programs: []

                        };

                    }
                );

            mergeChannels(
                parsed
            );

            toast(
                `${parsed.length.toLocaleString()} Xtream channels loaded`
            );

        } catch(error) {

            console.error(error);

            toast(
                "Xtream connection failed"
            );

        }

    }

    async function loadEPG() {

        const url =

            );

    function parseXMLTV(
        text
    ) {

        const parser =
            new DOMParser();

        const xml =
            parser.parseFromString(
                text,
                "application/xml"
            );

        const programmes =
            xml.querySelectorAll(
                "programme"
            );

        state.epg.clear();

        programmes.forEach(
            program => {

                const channel =
                    program.getAttribute(
                        "channel"
                    );

                if(!channel)
                    return;

                if(
                    !state.epg.has(channel)
                )
                    state.epg.set(
                        channel,
                        []
                    );

                state.epg
                    .get(channel)
                    .push({

                        start:
                            parseXMLDate(
                                program.getAttribute(
                                    "start"
                                )
                            ),

                        stop:
                            parseXMLDate(
                                program.getAttribute(
                                    "stop"
                                )
                            ),

                        title:
                            program
                                .querySelector(
                                    "title"
                                )
                                ?.textContent
                                .trim() ||
                            "Untitled"

                    });

            }
        );

    }

    function parseXMLDate(
        value
    ) {

        if(!value)
            return 0;

        const match =
            value.match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
            );

        if(!match)
            return Date.parse(
                value
            );

        return Date.UTC(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3]),
            Number(match[4]),
            Number(match[5]),
            Number(match[6])
        );

    }

    /* ========================================================
       GUIDE
       ======================================================== */

    function updateGuide() {

        const grid =
            $("guideGrid");

        if(!grid)
            return;

        const now =
            Date.now();

        const channels =
            state.filtered
                .slice(0,40);

        let html = "";

        html += `
            <div class="guide-head">
                Channel
            </div>
        `;

        for(
            let i = 0;
            i < 6;
            i++
        ) {

            html += `
                <div class="guide-head">
                    ${new Date(
                        now +
                        i * 3600000
                    ).toLocaleTimeString(
                        [],
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    )}
                </div>
            `;

        }

        for(
            const channel of channels
        ) {

            html += `

                <div class="guide-channel">

                    ${
                        channel.logo
                        ? `
                            <img
                                src="${escapeHTML(channel.logo)}"
                                style="
                                    width:36px;
                                    height:36px;
                                    object-fit:contain;
                                ">
                        `
                        : ""
                    }

                    <span>
                        ${escapeHTML(
                            channel.title
                        )}
                    </span>

                </div>
            `;

            const programs =
                channel.tvgId
                    ? (
                        state.epg.get(
                            channel.tvgId
                        ) || []
                    )
                    : [];

            if(
                !programs.length &&
                channel.now
            ) {

                programs.push(
                    {
                        ...channel.now,
                        start:
                            Date.parse(
                                channel.now.start
                            ),
                        stop:
                            Date.parse(
                                channel.now.stop
                            )
                    }
                );

            }

            if(
                !programs.length &&
                channel.next
            ) {

                programs.push(
                    {
                        ...channel.next,
                        start:
                            Date.parse(
                                channel.next.start
                            ),
                        stop:
                            Date.parse(
                                channel.next.stop
                            )
                    }
                );

            }

            for(
                let slot = 0;
                slot < 6;
                slot++
            ) {

                const slotStart =
                    now +
                    slot * 3600000;

                const program =
                    programs.find(
                        p =>
                            p.start <=
                            slotStart &&
                            p.stop >
                            slotStart
                    );

                html += `

                    <div
                        class="guide-program ${
                            program
                            ? "now"
                            : ""
                        }"
                        tabindex="0"
                        data-stream="${
                            escapeHTML(
                                channel.id
                            )
                        }">

                        <div class="program-title">
                            ${
                                program
                                ? escapeHTML(
                                    program.title
                                )
                                : "Live TV"
                            }
                        </div>

                        <div class="program-time">
                            ${
                                program
                                ? new Date(
                                    program.start
                                ).toLocaleTimeString(
                                    [],
                                    {
                                        hour:"2-digit",
                                        minute:"2-digit"
                                    }
                                )
                                : "No EPG data"
                            }
                        </div>

                    </div>
                `;

            }

        }

        grid.innerHTML =
            html;

    }

    /* ========================================================
       HEALTH PROBING
       ======================================================== */

    async function probeChannel(
        channel
    ) {

        channel.status =
            "probing";

        updateCardStatus(
            channel
        );

        try {

            const controller =
                new AbortController();

            const timer =
                setTimeout(
                    () =>
                        controller.abort(),
                    5000
                );

            const response =
                await fetch(
                    "/xvynora/api/probe?channel=" +
                    encodeURIComponent(
                        channel.id
                    ),
                    {
                        signal:
                            controller.signal,
                        cache: "no-store"
                    }
                );

            clearTimeout(
                timer
            );

            const result =
                await response.json();

            channel.status =
                result.health ||
                "unknown";

        } catch {

            channel.status =
                "unknown";

        }

        updateCardStatus(
            channel
        );

    }

    function updateCardStatus(
        channel
    ) {

        document
            .querySelectorAll(
                `[data-id="${CSS.escape(
                    channel.id
                )}"] .status-dot`
            )
            .forEach(
                dot => {

                    dot.className =
                        "status-dot " +
                        (
                            channel.status ===
                            "online"
                                ? "online"
                                : channel.status ===
                                  "failed"
                                    ? "offline"
                                    : "probing"
                        );

                }
            );

    }

    async function probeBatch(
        channels,
        concurrency = 5
    ) {

        let index = 0;

        async function worker() {

            while(
                index < channels.length
            ) {

                const current =
                    channels[
                        index++
                    ];

                await probeChannel(
                    current
                );

            }

        }

        await Promise.all(
            Array.from(
                {
                    length:
                        Math.min(
                            concurrency,
                            channels.length
                        )
                },
                worker
            )
        );

    }

    async function openPlayer(
        channel
    ) {

        if(!channel)
            return;

        state.current =

        $("player").classList.add(

    }

    async function playStream(
        channel
    ) {

        destroyHLS();

        const video =
            $("video");

        const url =
            normalizeUrl(
                channel.stream
            );

        if(!url) {

            toast(
                "This channel has no stream URL"
            );

            return;

        }

        try {

            if(
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ) {

                video.src =
                    url;

                await video.play();

                channel.status =
                    "online";

                updateCardStatus(
                    channel
                );

            }

            else if(
                window.Hls &&
                Hls.isSupported()
            ) {

                state.hls =
                    new Hls({

                        enableWorker: true,

                        lowLatencyMode:
                            true,

                        backBufferLength:
                            30,

                        maxBufferLength:
                            20,

                        capLevelToPlayerSize:
                            true

                    });

                state.hls.loadSource(
                    url
                );

                state.hls.attachMedia(
                    video
                );

                state.hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    () => {

                        populateQuality();

                        video.play()
                            .catch(
                                () => {}
                            );

                        channel.status =
                            "online";

                        updateCardStatus(
                            channel
                        );

                    }
                );

                state.hls.on(
                    Hls.Events.ERROR,
                    (
                        event,
                        data
                    ) => {

                        if(
                            data.fatal
                        ) {

                            if(
                                data.type ===
                                Hls.ErrorTypes.NETWORK_ERROR
                            ) {

                                state.hls.startLoad();

                            }

                            else if(
                                data.type ===
                                Hls.ErrorTypes.MEDIA_ERROR
                            ) {

                                state.hls.recoverMediaError();

                            }

                            else {

                                failover(
                                    channel
                                );

                            }

                        }

                    }
                );

            }

            else {

                video.src =
                    url;

                await video.play();

                channel.status =
                    "online";

                updateCardStatus(
                    channel
                );

            }

        } catch(error) {

            console.error(error);

            channel.status =
                "failed";

            updateCardStatus(
                channel
            );

            failover(
                channel
            );

        }

    }

    function destroyHLS() {

        if(state.hls) {

            try {
                state.hls.destroy();
            } catch {}

            state.hls =
                null;

        }

    }

    function populateQuality() {

        const select =
            $("quality");

        select.innerHTML = `
            <option value="-1">
                Auto
            </option>
        `;

        if(!state.hls)
            return;

        state.hls.levels.forEach(
            (level,index) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    index;

                option.textContent =
                    level.height
                        ? `${level.height}p`
                        : `${Math.round(
                            (level.bitrate || 0) /
                            1000
                        )} kbps`;

                select.appendChild(
                    option
                );

            }
        );

    }

    function failover(
        failed
    ) {

        const alternatives =
            state.channels.filter(
                channel =>
                    channel.id !==
                    failed.id &&
                    (
                        channel.group ===
                        failed.group ||
                        channel.tvgId ===
                        failed.tvgId
                    )
            );

        if(
            alternatives.length
        ) {

            toast(
                "Stream failed — trying another source"
            );

            openPlayer(
                alternatives[0]
            );

        } else {

            toast(
                "Stream unavailable"
            );

        }

    }

    /* ========================================================
       RECORDING
       ======================================================== */

    function startRecording() {

        const video =
            $("video");

        if(
            !window.MediaRecorder
        ) {

            toast(
                "MediaRecorder is not supported by this browser"
            );

            return;

        }

        if(
            !video.captureStream
        ) {

            toast(
                "This browser cannot capture the video element"
            );

            return;

        }

        try {

            const stream =
                video.captureStream();

            let mime =
                "";

            const options = [
                "video/webm;codecs=vp9,opus",
                "video/webm;codecs=vp8,opus",
                "video/webm"
            ];

            for(
                const candidate
                of options
            ) {

                if(
                    MediaRecorder.isTypeSupported(
                        candidate
                    )
                ) {

                    mime =
                        candidate;

                    break;

                }

            }

            state.recordedChunks =
                [];

            state.recorder =
                new MediaRecorder(
                    stream,
                    mime
                        ? {mimeType:mime}
                        : undefined
                );

            state.recorder.ondataavailable =
                event => {

                    if(
                        event.data.size
                    )
                        state.recordedChunks
                            .push(
                                event.data
                            );

                };

            state.recorder.onstop =
                saveRecording;

            state.recorder.start(
                1000
            );

            state.recordStarted =
                Date.now();

            $("recording")
                .classList.add(
                    "active"
                );

            state.recordTimer =
                setInterval(
                    updateRecordTimer,
                    1000
                );

            toast(
                "Recording started"
            );

        } catch(error) {

            console.error(error);

            toast(
                "Recording could not start"
            );

        }

    }

    function stopRecording() {

        if(
            !state.recorder
        )
            return;

        state.recorder.stop();

        clearInterval(
            state.recordTimer
        );

        $("recording")
            .classList.remove(
                "active"
            );

        state.recorder =
            null;

    }

    function updateRecordTimer() {

        const elapsed =
            Math.floor(
                (
                    Date.now() -
                    state.recordStarted
                ) / 1000
            );

        const minutes =
            Math.floor(
                elapsed / 60
            )
            .toString()
            .padStart(2,"0");

        const seconds =
            (
                elapsed % 60
            )
            .toString()
            .padStart(2,"0");

        $("recordTimer")
            .textContent =
            `${minutes}:${seconds}`;

    }

    function saveRecording() {

        if(
            !state.recordedChunks.length
        )
            return;

        const blob =
            new Blob(
                state.recordedChunks,
                {
                    type:
                        state.recordedChunks[0]
                            .type ||
                        "video/webm"
                }
            );

        const url =
            URL.createObjectURL(
                blob
            );

        const link =
            document.createElement(
                "a"
            );

        link.href =
            url;

        link.download =
            `${(
                state.current?.title ||
                "xvynora-recording"
            ).replace(
                /[^a-z0-9-_]+/gi,
                "-"
            )}-${Date.now()}.webm`;

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();

        setTimeout(
            () =>
                URL.revokeObjectURL(
                    url
                ),
            5000
        );

        toast(
            "Recording saved"
        );

    }
